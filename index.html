<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#241A12">
<meta name="description" content="A 3D ATLANTA property board game where every price is real, taken from HM Land Registry open data created by Hahz &quot;Wizard of Hahz&quot; Terry. An original homage to Elizabeth Magie's The Landlord's Game of 1904 based in Atlantic City, NJ.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="license" href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/">
<title>LANDLORD: ATLANTA 2026</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <canvas id="board-canvas"></canvas>
  <div id="hud"></div>
  <div id="overlay" aria-live="polite"></div>

  <div id="boot" role="status">
    <div class="boot-plate">
      <div class="boot-band"></div>
      <div class="boot-body">
        <p class="boot-eyebrow">City of Atlanta</p>
        <h1 class="boot-title">Landlord: Atlanta 2026</h1>
        <p class="boot-sub">Every price on this board is real.</p>
        <p class="boot-status" id="boot-status">Loading the fact base…</p>
      </div>
    </div>
  </div>

  <!-- Swept by the integrity gate for banned terms. Its numerals are licence
       versions and dates rendered verbatim from the fact base, hence
       data-numeral-ok; nothing here is a market figure. -->
  <footer id="attribution" data-fact="attribution" data-numeral-ok></footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
